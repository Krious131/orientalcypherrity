name: Build OrbitsCoder APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Check app and build APK
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Run game engine checks
        run: npm run test:engine

      - name: Check TypeScript and build web app
        run: npm run build

      - name: Set up Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          accept-android-sdk-licenses: false
          packages: ''

      - name: Accept Android SDK licenses
        shell: bash
        run: |
          set +e
          set +o pipefail
          yes | sdkmanager --licenses > /tmp/android-sdk-licenses.log 2>&1
          status=$?
          tail -n 20 /tmp/android-sdk-licenses.log
          exit "$status"

      - name: Install Android SDK packages
        run: sdkmanager 'platform-tools' 'platforms;android-34' 'build-tools;34.0.0'

      - name: Generate Android project
        run: npx cap add android

      - name: Sync Android app
        run: npx cap sync android

      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v7
        with:
          name: orbitscoder-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
